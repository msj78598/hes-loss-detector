# Streamlit Community Cloud parks an app that sees no traffic, and waking it is a
# cold start from nothing: clone, install forty-five packages, import scikit-learn,
# unpickle the model. That is the whole delay — the model itself loads in about a
# second and is already zlib-compressed, so there is nothing to win inside it.
#
# So the app is simply kept awake. A plain GET every six hours counts as traffic.
# Nothing here touches the model, the code, or the results.
name: keep-warm

on:
  schedule:
    - cron: "0 */6 * * *"   # every six hours
  workflow_dispatch:         # and on demand, from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        run: |
          URL="${{ vars.APP_URL || 'https://asdpro1.streamlit.app/' }}"
          echo "Pinging $URL"
          # Community Cloud answers a parked app with a 303 to its wake page, so
          # redirects are followed and the final code is what counts. curl's exit
          # status is captured separately — folding it into the same variable
          # concatenates the two and prints nonsense like "303000".
          code=$(curl -sSL -o /dev/null                       -A 'keep-warm (github-actions)'                       -w '%{http_code}' --max-time 120 --retry 2 --retry-delay 10                       "$URL")
          rc=$?
          echo "final HTTP ${code:-none} · curl exit ${rc}"
          # The job's purpose is traffic, not gating, so it never fails the run —
          # it only flags the case where nothing answered at all.
          if [ "$rc" -ne 0 ] || [ -z "$code" ] || [ "$code" = "000" ]; then
            echo "::warning::no usable response (code=${code:-none}, curl=${rc}) — check APP_URL"
          fi
